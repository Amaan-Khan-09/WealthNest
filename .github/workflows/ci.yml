name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - name: Unit, pipeline, robustness and app smoke tests
        run: python -m pytest -q
      - name: Fixtures still match the benchmark lock
        run: python -m bench.make_fixtures --check
